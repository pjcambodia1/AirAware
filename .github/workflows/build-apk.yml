name: Build AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build AirAware Signed AAB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Android keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/airaware-release.keystore

      - name: Build release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "Finding Gradle project..."
          GRADLE_ROOT=$(dirname "$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
          echo "Gradle root: $GRADLE_ROOT"

          if [ -z "$GRADLE_ROOT" ] || [ "$GRADLE_ROOT" = "." ]; then
            echo "ERROR: Could not find Android Gradle project."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          cd "$GRADLE_ROOT"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew bundleRelease
          else
            gradle bundleRelease
          fi

      - name: Locate AAB
        run: |
          find . -name "*.aab" -type f
          mkdir -p release-output
          cp "$(find . -name "*.aab" -type f | head -n 1)" release-output/AirAware-release.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirAware-release-aab
          path: release-output/AirAware-release.aab

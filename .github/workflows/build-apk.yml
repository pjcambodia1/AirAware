name: Build AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build AirAware Signed AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Android keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/airaware-release.keystore

      - name: Build release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
            cd android
            ./gradlew bundleRelease
          elif [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew -p android bundleRelease
          else
            cd android
            gradle bundleRelease
          fi

      - name: Locate AAB
        run: |
          find android/app/build/outputs/bundle -name "*.aab" -type f
          mkdir -p release-output
          cp $(find android/app/build/outputs/bundle -name "*.aab" -type f | head -n 1) release-output/AirAware-release.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirAware-release-aab
          path: release-output/AirAware-release.aab

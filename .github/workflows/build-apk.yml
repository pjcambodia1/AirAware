name: Build APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore Android resource files
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

      - name: Verify Android permissions and icon
        run: |
          grep -n "CAMERA" android/app/src/main/AndroidManifest.xml
          grep -n "ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml
          grep -n "INTERNET" android/app/src/main/AndroidManifest.xml

      - name: Decode Android keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/airaware-release.keystore

      - name: Export signing environment variables
        run: |
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Verify keystore exists
        run: |
          ls -lh android/app/airaware-release.keystore

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build signed release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Verify APK output
        run: |
          ls -lh android/app/build/outputs/apk/release/

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirAware-release-apk
          path: android/app/build/outputs/apk/release/*.apk
